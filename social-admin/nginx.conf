# nginx config for social-admin
# SSE locations MUST come before generic catch-all.

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── SSE streaming (MUST be before generic /admin location) ──
    location ~ ^/(chat/stream|chat/transfer-wait|admin/transfer/.*/stream) {
        proxy_pass http://ai-agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ── business mock API (keep /api prefix, mock_api router has prefix=/api) ──
    location /api/ {
        proxy_pass http://ai-agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── Agent direct endpoints ──
    location ~ ^/(health|chat|admin)(/|$) {
        proxy_pass http://ai-agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
