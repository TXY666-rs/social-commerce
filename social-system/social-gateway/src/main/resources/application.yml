server:
  port: 9000

spring:
  application:
    name: social-gateway

  cloud:
    nacos:
      discovery:
        server-addr: 192.168.211.100:8848
        group: com.social
      config:
        server-addr: 192.168.211.100:8848
        file-extension: yaml
        group: com.social

    sentinel:
      transport:
        dashboard: localhost:8580
      eager: true
      datasource:
        - name: gateway_flow
          file:
            file: classpath:sentinel-flow.json
            ruleType: flow

  config:
    import:
      - optional:nacos:social-gateway?group=com.social&refresh=true

# 可观测性：Actuator + Prometheus 配置
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
