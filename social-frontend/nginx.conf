# nginx config for social-frontend
# - static assets
# - reverse proxy to ai-agent (business API + Agent chat/SSE)
#
# Key: SSE locations MUST come before the generic catch-all,
#      otherwise /chat/stream matches ^/(health|chat|admin) first
#      and gets a 60s timeout instead of the long-lived SSE config.

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # static assets + history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── SSE streaming (MUST be before generic /chat location) ──
    # 关闭缓冲 + 长超时，否则 SSE 连接会被 nginx 提前关闭
    location ~ ^/(chat/stream|chat/transfer-wait|admin/transfer/.*/stream) {
        proxy_pass http://ai-agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE critical settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ── business mock API (/api/* -> ai-agent, strip /api via prefix match) ──
    location /api/ {
        proxy_pass http://ai-agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Agent direct endpoints (/chat /admin /health, no /api prefix) ──
    location ~ ^/(health|chat|admin)(/|$) {
        proxy_pass http://ai-agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
