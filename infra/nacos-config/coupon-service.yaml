# ============================================
# coupon-service — Data ID: coupon-service.yaml
# Group: com.social
# ============================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/social_coupon   # ← 替换为你的 PostgreSQL 地址
    username: postgres                                    # ← 替换为你的数据库用户名
    password:                                             # ← 替换为你的数据库密码

mybatis-plus:
  type-aliases-package: com.social.couponservice.domain.po

# JWT（coupon-service 依赖 social-auth，需要 JWT 配置）
jwt:
  secret: your-jwt-secret-key-change-me-at-least-32-chars  # ← 与 social-common 保持一致
  expiration: 86400000
