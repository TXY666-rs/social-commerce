# ============================================
# Nacos 网关配置 — social-gateway.yaml
# Group: com.social
# ============================================
# 在 Nacos 控制台新建：
#   Data ID:  social-gateway.yaml
#   Group:    com.social
#   格式:     YAML
# ============================================

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/coupon/**
        - id: memory-service
          uri: lb://memory-service
          predicates:
            - Path=/api/memory/**
        - id: ai-agent
          uri: http://localhost:8000    # ← AI Agent 地址，按需修改
          predicates:
            - Path=/api/ai/**

# JWT（gateway 不导入 social-common，需要单独配置）
jwt:
  secret: your-jwt-secret-key-change-me-at-least-32-chars  # ← 与 social-common 保持一致
  expiration: 86400000
  header: Authorization
  tokenPrefix: "Bearer "
