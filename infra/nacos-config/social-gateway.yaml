# ============================================
# Nacos 网关配置 — social-gateway.yaml
# Group: com.social
# ============================================
# 在 Nacos 控制台新建：
#   Data ID:  social-gateway.yaml
#   Group:    com.social
#   格式:     YAML
# ============================================

spring:
  cloud:
    gateway:
      routes:
        # 用户服务
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/users/**
        # 订单服务
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**,/api/orders/**,/api/address/**,/api/after-sale/**
        # 商品服务
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**,/api/products/**,/api/category/**
        # 优惠券服务
        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/coupon/**,/api/coupons/**
        # AI Agent
        - id: ai-agent
          uri: http://localhost:8000
          predicates:
            - Path=/api/ai/**

    sentinel:
      transport:
        dashboard: localhost:8580
