# ============================================
# Nacos 共享配置 — social-common.yaml
# Group: com.social
# ============================================
# 在 Nacos 控制台 → 配置管理 → 配置列表 中新建：
#   Data ID:  social-common.yaml
#   Group:    com.social
#   格式:     YAML
# ============================================

spring:
  # 数据库连接池（各服务在自身配置中覆盖 url/username/password）
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis（请替换为你的 Redis 地址和密码）
  data:
    redis:
      host: localhost          # ← 替换为你的 Redis 地址
      port: 6379
      password:                # ← 替换为你的 Redis 密码，无密码留空
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # OpenFeign 服务间调用
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
      circuitbreaker:
        enabled: true

  # JSON 序列化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 公共配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境建议关闭 SQL 日志
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（user-service、coupon-service、gateway 共用）
jwt:
  secret: your-jwt-secret-key-change-me-at-least-32-chars  # ← 务必替换为你自己的密钥
  expiration: 86400000
  header: Authorization
  tokenPrefix: "Bearer "
